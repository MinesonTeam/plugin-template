version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    
    open-pull-requests-limit: 5
    
    ignore:
      - dependency-name: "org.spigotmc:spigot-api"
      - dependency-name: "io.papermc.paper:paper-api"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

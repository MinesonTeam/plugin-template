name: 🛠️ Dev Build (Alpha Release)

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

env:
  MODRINTH_ID: 'YOUR_MODRINTH_ID_HERE'
  CURSEFORGE_ID: 'YOUR_CURSEFORGE_ID_HERE'
  MC_VERSIONS: '>=1.8 <=1.21.11'
  LOADERS: 'bukkit, paper, purpur, spigot'

permissions:
  contents: write

jobs:
  build-and-publish-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: Set up JDK 21 (For Gradle 9)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Tests
        run: chmod +x gradlew && ./gradlew test

      - name: Build shadowJar
        run: ./gradlew clean shadowJar

      - name: Extract Project Name and Version
        run: |
          NAME=$(grep "rootProject.name" settings.gradle | cut -d'=' -f2 | tr -d " \r'\"")
          VERSION=$(grep "projectVersion=" gradle.properties | cut -d'=' -f2 | tr -d '\r')
          echo "PROJECT_NAME=$NAME" >> $GITHUB_ENV
          echo "PROJECT_VERSION=$VERSION" >> $GITHUB_ENV
          
      - name: Rename JAR for Dev Release
        run: |
          for file in build/libs/*.jar; do
            mv "$file" "${file%.jar}-dev.${{ github.run_number }}.jar"
          done

      - name: Get Last Commit Message
        run: |
          MSG=$(git log -1 --pretty=format:'%s')
          echo "COMMIT_MSG=$MSG" >> $GITHUB_ENV

      - name: Publish Alpha to Modrinth & CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          
          name: "${{ env.PROJECT_NAME }} v${{ env.PROJECT_VERSION }} (Dev #${{ github.run_number }})"
          changelog: ${{ env.COMMIT_MSG }}
          version: "${{ env.PROJECT_VERSION }}-alpha.${{ github.run_number }}"
          version-type: alpha
          
          loaders: ${{ env.LOADERS }}
          game-versions: ${{ env.MC_VERSIONS }}
          files: build/libs/*.jar

      - name: Delete old GitHub dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete dev-latest --cleanup-tag -y || true

      - name: Create Rolling Dev Release in GitHub
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: dev-latest
          name: "🚧 Development Build (Latest)"
          generate_release_notes: true
          prerelease: true
          files: build/libs/*.jar
